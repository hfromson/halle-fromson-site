  <style>
    :root, .sw-root {
      --sw-bg: #FAF9F6;            /* == the stills' background — seamless posters */
      --sw-ink: #16181D;
      --sw-ink-soft: #43464E;
      --sw-accent: #1F4D46;
      --sw-font-display: "Fraunces", Georgia, serif;
      --sw-font-body: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .alt-links {
      position: fixed;
      right: calc(16px + env(safe-area-inset-right, 0px));
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
      font-family: var(--sw-font-body); font-size: 12.5px; font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase;
    }
    .alt-links a {
      color: var(--sw-ink); text-decoration: none; border: 1.5px solid currentColor;
      border-radius: 99px; padding: 8px 14px; background: rgba(250,249,246,.85);
    }
    .alt-links a:hover { color: var(--sw-accent); }
  </style>
</head>
<body>
  <div id="top"></div>
  <nav class="alt-links" aria-label="Alternate version">
    <a href="resume.html">60-second version →</a>
  </nav>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Halle Fromson', href: '#top' },
      hint: 'scroll the project',
      nav: true,
      atmosphere: true,
      diveScroll: 1.4,
      connScroll: 0.9,
      sections: [
        {
          id: 'brief', label: 'The brief',
          still: 'assets/brief.webp', clip: 'assets/vid/brief.mp4',
          accent: '#1F4D46',
          scroll: 1.7, linger: 0.45,
          eyebrow: 'Creative operations · Project management',
          title: 'Every project starts as a pile of ambition.',
          body: 'A brief, a deadline, twelve opinions, and a hundred moving pieces. This is a short story about what happens next — and the person who keeps it moving.',
          tags: [],
        },
        {
          id: 'plan', label: 'The plan',
          still: 'assets/plan.webp', clip: 'assets/vid/plan.mp4',
          accent: '#2E6B5E',
          eyebrow: 'The plan',
          title: 'First, the chaos gets a spine.',
          body: 'Scopes, timelines, owners, dependencies. I break ambitious briefs into plans people can actually execute — and keep the plan honest as everything changes.',
          tags: ['Scopes', 'Timelines', 'Dependencies'],
        },
        {
          id: 'production', label: 'Production',
          still: 'assets/production.webp', clip: 'assets/vid/production.mp4',
          accent: '#B4653F',
          eyebrow: 'Production',
          title: 'Then the work starts flying.',
          body: 'Designers, directors, clients, vendors — versions and feedback everywhere. At Arsonal Design in LA I coordinate entertainment campaigns exactly like this: nothing lost between hands.',
          tags: ['Versioning', 'Reviews', 'Trafficking'],
        },
        {
          id: 'review', label: 'The review',
          still: 'assets/review.webp', clip: 'assets/vid/review.mp4',
          accent: '#1F4D46',
          eyebrow: 'The review',
          title: 'Feedback lands. Nothing slips.',
          body: 'Rounds run on time, decisions get captured, risks get flagged early — with options, not alarms. Clients see calm; the team gets clarity.',
          tags: ['Approvals', 'Redlines', 'Escalation'],
        },
        {
          id: 'finish', label: 'Finish line',
          still: 'assets/finish.webp', clip: 'assets/vid/finish.mp4',
          accent: '#B4653F',
          scroll: 1.9, linger: 0.5,
          eyebrow: 'The finish line',
          title: 'Delivered. On time. Intact.',
          body: 'That journey is my job — and I’m looking for the next team that ships this way: creative operations, project management, and production coordination.',
          tags: [],
          cta: {
            primary: { label: 'Experience & strengths', href: 'resume.html' },
            secondary: { label: 'Connect on LinkedIn', href: 'https://www.linkedin.com/in/halle-fromson-1288aa114/' },
          },
        },
      ],
      connectors: ['assets/vid/conn1.mp4', 'assets/vid/conn2.mp4', 'assets/vid/conn3.mp4', 'assets/vid/conn4.mp4'],
    });
  </script>
</body>
</html>
